[project]
name = "modularcua"
version = "0.1.0"
description = "Independent Prime-inspired computer-use agent harness"
requires-python = ">=3.11"
dependencies = [
  "openai==2.41.0",
  "PyYAML==6.0.3",
  "ipython==9.8.0",
    "Pillow~=11.0.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

