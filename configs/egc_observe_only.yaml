name: modularcua-egc-observe-only
extends: core_v0.yaml
environment:
  task_id: "001"
egc:
  skill_md_enabled: false
  actor_feedback_enabled: false
  max_feedback_rounds: 2
  max_aux_tokens: 4096
  max_aux_tokens_cap: 8192
  max_aux_retries: 1
  visual_state_every_n_screenshots: 3
  recovery_repeat_threshold: 3
  modules:
    requirement_contracts: true
    contract_updater: true
    structured_state: true
    provenance_tracker: true
    self_verifier: true
    recovery_planner: true
    termination: true
    history_summarizer: false
